name: forgepulse

services:
  forgepulse:
    image: forgepulse:local
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FORGEPULSE_DB: sqlite:/data/forgepulse.db
      FORGEPULSE_HOST: 0.0.0.0
      FORGEPULSE_GIT_REF: ${FORGEPULSE_GIT_REF:-local}
    ports:
      - "127.0.0.1:18744:18744"
    volumes:
      - forgepulse-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18744/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  forgepulse-data:
